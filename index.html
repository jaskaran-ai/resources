<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iVALT Resources</title>
  <meta name="description" content="Image and asset resources for iVALT." />
  <link rel="icon" href="/images/logohome.png" />
  <style>
    :root {
      --bg: #f6f8fc;
      --surface: #ffffff;
      --surface-2: #eef2f9;
      --border: #dfe5ef;
      --text: #0f1729;
      --muted: #5b6b85;
      --brand: #1a5cff;
      --brand-ink: #ffffff;
      --shadow: 0 1px 2px rgba(15, 23, 41, .06), 0 8px 24px rgba(15, 23, 41, .06);
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0f1c;
        --surface: #121a2b;
        --surface-2: #1a2438;
        --border: #26324a;
        --text: #eaf0fb;
        --muted: #94a3bb;
        --brand: #5b8bff;
        --brand-ink: #06122b;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px rgba(0, 0, 0, .35);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    header.site {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: saturate(1.4) blur(10px);
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      border-bottom: 1px solid var(--border);
    }
    .bar { display: flex; align-items: center; gap: 14px; padding: 14px 0; }
    .bar img { height: 34px; width: auto; display: block; }
    .bar .title { display: flex; flex-direction: column; line-height: 1.15; }
    .bar .title strong { font-size: 17px; letter-spacing: -.01em; }
    .bar .title span { font-size: 12.5px; color: var(--muted); }
    .bar .spacer { flex: 1; }

    .search {
      position: relative;
      flex: 0 1 300px;
    }
    .search input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
    .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: .5; }

    .hero { padding: 40px 0 8px; }
    .hero h1 { font-size: clamp(26px, 4vw, 38px); margin: 0 0 8px; letter-spacing: -.02em; }
    .hero p { margin: 0; color: var(--muted); font-size: 15.5px; max-width: 60ch; }
    .count { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; color: var(--muted); }
    .count b { color: var(--text); }

    main { padding: 18px 0 64px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform .18s ease, border-color .18s ease;
    }
    .card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--brand) 45%, var(--border)); }

    .thumb {
      position: relative;
      aspect-ratio: 4 / 3;
      background:
        repeating-conic-gradient(var(--surface-2) 0% 25%, transparent 0% 50%);
      background-size: 18px 18px;
      cursor: zoom-in;
      border: 0;
      padding: 0;
      width: 100%;
      display: block;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      padding: 10px;
    }
    .badge {
      position: absolute; top: 10px; right: 10px;
      font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase;
      background: color-mix(in srgb, var(--surface) 80%, transparent);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 3px 7px; border-radius: 6px;
      backdrop-filter: blur(6px);
    }
    .meta { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
    .name {
      font-size: 13px; font-weight: 600; letter-spacing: -.01em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .size { font-size: 11.5px; color: var(--muted); }
    .actions { display: flex; gap: 8px; }
    .btn {
      flex: 1;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 10px; border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 12.5px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: background .15s, border-color .15s, color .15s;
    }
    .btn:hover { border-color: color-mix(in srgb, var(--brand) 50%, var(--border)); color: var(--brand); }
    .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
    .btn.primary:hover { filter: brightness(1.06); color: var(--brand-ink); }
    .btn.copied { background: #16a34a; color: #fff; border-color: transparent; }

    .empty { display: none; text-align: center; padding: 70px 20px; color: var(--muted); }

    /* Lightbox */
    dialog.lb {
      border: 0; padding: 0; background: transparent;
      width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh;
      overflow: hidden;
    }
    dialog.lb::backdrop { background: rgba(3, 7, 18, .82); backdrop-filter: blur(4px); }
    .lb-inner { position: relative; width: 100%; height: 100%; display: grid; grid-template-rows: 1fr auto; }
    .lb-stage { position: relative; display: flex; align-items: center; justify-content: center; padding: 28px; min-height: 0; }
    .lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .lb-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 18px; background: rgba(10, 15, 28, .9);
      border-top: 1px solid rgba(255,255,255,.1); color: #eaf0fb;
    }
    .lb-bar .lb-name { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 120px; }
    .lb-bar .btn { flex: 0 0 auto; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.16); color: #eaf0fb; }
    .lb-bar .btn:hover { color: #fff; border-color: rgba(255,255,255,.4); }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 46px; height: 46px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.2); background: rgba(10,15,28,.7); color: #fff;
      font-size: 22px; line-height: 1; cursor: pointer; display: grid; place-items: center;
      transition: background .15s, transform .15s;
    }
    .lb-nav:hover { background: rgba(30,41,59,.95); }
    .lb-nav.prev { left: 18px; }
    .lb-nav.next { right: 18px; }
    .lb-close {
      position: absolute; top: 16px; right: 18px; z-index: 2;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.2); background: rgba(10,15,28,.7); color: #fff;
      font-size: 20px; cursor: pointer; display: grid; place-items: center;
    }
    .lb-close:hover { background: rgba(30,41,59,.95); }

    footer.site { border-top: 1px solid var(--border); padding: 26px 0 40px; color: var(--muted); font-size: 13px; }
    footer.site a { color: var(--brand); text-decoration: none; }
    footer.site a:hover { text-decoration: underline; }

    .toast {
      position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
      background: #0f1729; color: #fff; padding: 10px 16px; border-radius: 10px;
      font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s; z-index: 50;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 620px) {
      .bar { flex-wrap: wrap; }
      .search { flex-basis: 100%; order: 3; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
      .lb-nav { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap bar">
      <img src="/images/logohome.png" alt="iVALT" onerror="this.style.display='none'" />
      <div class="title">
        <strong>iVALT Resources</strong>
        <span>Shared images &amp; assets</span>
      </div>
      <div class="spacer"></div>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="q" type="search" placeholder="Search assets…" autocomplete="off" spellcheck="false" />
      </label>
    </div>
  </header>

  <section class="wrap hero">
    <h1>Resources</h1>
    <p>A curated library of product imagery, screenshots, and brand assets. Click any asset to preview it full size or copy its direct link.</p>
    <div class="count"><b id="shown">0</b> <span id="shownLabel">assets</span></div>
  </section>

  <main class="wrap">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">No assets match your search.</div>
  </main>

  <footer class="site">
    <div class="wrap">
      iVALT Resources · <a href="https://ivalt.com" target="_blank" rel="noopener noreferrer">ivalt.com</a>
    </div>
  </footer>

  <dialog class="lb" id="lb">
    <div class="lb-inner">
      <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
      <div class="lb-stage">
        <button class="lb-nav prev" id="lbPrev" aria-label="Previous">‹</button>
        <img id="lbImg" alt="" />
        <button class="lb-nav next" id="lbNext" aria-label="Next">›</button>
      </div>
      <div class="lb-bar">
        <span class="lb-name" id="lbName"></span>
        <button class="btn" id="lbCopy">Copy link</button>
        <a class="btn primary" id="lbOpen" target="_blank" rel="noopener">Open original</a>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast">Link copied</div>

  <script>
    const ASSETS = [
      { file: "alert.PNG", size: "297 KB" },
      { file: "confirm.jpg", size: "54 KB" },
      { file: "face.PNG", size: "147 KB" },
      { file: "GmUR16masAA1ck5.jpeg", size: "250 KB" },
      { file: "GmVAZgBbsAA2Nxn.jpeg", size: "114 KB" },
      { file: "home-old.PNG", size: "187 KB" },
      { file: "home.PNG", size: "62 KB" },
      { file: "human-bounded.png", size: "712 KB" },
      { file: "human-bounded.webp", size: "52 KB" },
      { file: "logo-blue.png", size: "20 KB" },
      { file: "logo.png", size: "195 KB" },
      { file: "logohome.png", size: "18 KB" },
      { file: "menu-old.PNG", size: "188 KB" },
      { file: "menu.PNG", size: "39 KB" },
      { file: "notification.PNG", size: "339 KB" },
      { file: "ondeamdid-old.PNG", size: "95 KB" },
      { file: "ondeamdid.PNG", size: "81 KB" },
      { file: "ondemand.png", size: "212 KB" },
      { file: "success.PNG", size: "86 KB" },
      { file: "webcard.png", size: "9 KB" }
    ].map(a => ({ ...a, url: "images/" + a.file }));

    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const q = document.getElementById("q");
    const shown = document.getElementById("shown");
    const shownLabel = document.getElementById("shownLabel");
    const toast = document.getElementById("toast");

    const ext = f => (f.split(".").pop() || "").toUpperCase();
    const prettySize = f => {
      const kb = f.match(/[\d.]+/);
      return kb ? kb[0] + " KB" : "";
    };

    let visible = ASSETS.slice();

    function card(a) {
      const el = document.createElement("article");
      el.className = "card";
      el.innerHTML = `
        <button class="thumb" type="button" aria-label="Preview ${a.file}">
          <img loading="lazy" decoding="async" src="${a.url}" alt="${a.file}" />
          <span class="badge">${ext(a.file)}</span>
        </button>
        <div class="meta">
          <div class="name" title="${a.file}">${a.file}</div>
          <div class="size">${a.size}</div>
          <div class="actions">
            <a class="btn" href="${a.url}" download>Download</a>
            <button class="btn primary" type="button" data-copy="${a.url}">Copy link</button>
          </div>
        </div>`;
      el.querySelector(".thumb").addEventListener("click", () => openLb(a));
      return el;
    }

    function render(list) {
      visible = list;
      grid.replaceChildren(...list.map(card));
      empty.style.display = list.length ? "none" : "block";
      shown.textContent = list.length;
      shownLabel.textContent = list.length === 1 ? "asset" : "assets";
    }

    function filter() {
      const term = q.value.trim().toLowerCase();
      render(term ? ASSETS.filter(a => a.file.toLowerCase().includes(term)) : ASSETS);
    }
    q.addEventListener("input", filter);

    document.addEventListener("click", async e => {
      const btn = e.target.closest("[data-copy]");
      if (!btn) return;
      const url = new URL(btn.dataset.copy, location.href).href;
      await copy(url);
      const old = btn.textContent;
      btn.textContent = "Copied";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 1400);
    });

    async function copy(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const t = document.createElement("textarea");
        t.value = text; document.body.appendChild(t); t.select();
        document.execCommand("copy"); t.remove();
      }
      toast.classList.add("show");
      clearTimeout(copy._t);
      copy._t = setTimeout(() => toast.classList.remove("show"), 1500);
    }

    /* Lightbox */
    const lb = document.getElementById("lb");
    const lbImg = document.getElementById("lbImg");
    const lbName = document.getElementById("lbName");
    const lbOpen = document.getElementById("lbOpen");
    const lbCopy = document.getElementById("lbCopy");
    let idx = 0;

    function openLb(a) {
      idx = visible.indexOf(a);
      showLb();
      if (typeof lb.showModal === "function") lb.showModal();
      else lb.setAttribute("open", "");
    }
    function showLb() {
      const a = visible[idx]; if (!a) return;
      lbImg.src = a.url; lbImg.alt = a.file;
      lbName.textContent = `${a.file} · ${a.size}`;
      lbOpen.href = a.url;
      lbCopy.dataset.url = a.url;
    }
    function step(d) { if (!visible.length) return; idx = (idx + d + visible.length) % visible.length; showLb(); }
    function closeLb() { if (typeof lb.close === "function") lb.close(); else lb.removeAttribute("open"); }

    document.getElementById("lbPrev").addEventListener("click", () => step(-1));
    document.getElementById("lbNext").addEventListener("click", () => step(1));
    document.getElementById("lbClose").addEventListener("click", closeLb);
    lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
    lbCopy.addEventListener("click", () => copy(new URL(lbCopy.dataset.url, location.href).href));
    document.addEventListener("keydown", e => {
      if (!lb.hasAttribute("open")) return;
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
    });

    render(ASSETS);
  </script>
</body>
</html>
